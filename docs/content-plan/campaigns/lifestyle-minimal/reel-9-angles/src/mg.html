<div id="hook"><div class="a">1 แก้ว</div><div class="b">เล่าได้ 9 มุม 👀</div></div>
<div id="cnt">01 / 09</div>
<div id="grid"><div id="gt"><div class="a">1 แก้ว · <i>9 angles</i></div></div><div class="t" id="t0" style="left:93px;top:330px;background-image:url('file:///home/user/hibi-green-tea/docs/content-plan/campaigns/lifestyle-minimal/reel-9-angles/frames/a01.png')"><span>1</span></div><div class="t" id="t1" style="left:395px;top:330px;background-image:url('file:///home/user/hibi-green-tea/docs/content-plan/campaigns/lifestyle-minimal/reel-9-angles/frames/a02.png')"><span>2</span></div><div class="t" id="t2" style="left:697px;top:330px;background-image:url('file:///home/user/hibi-green-tea/docs/content-plan/campaigns/lifestyle-minimal/reel-9-angles/frames/a03.png')"><span>3</span></div><div class="t" id="t3" style="left:93px;top:704px;background-image:url('file:///home/user/hibi-green-tea/docs/content-plan/campaigns/lifestyle-minimal/reel-9-angles/frames/a04.png')"><span>4</span></div><div class="t" id="t4" style="left:395px;top:704px;background-image:url('file:///home/user/hibi-green-tea/docs/content-plan/campaigns/lifestyle-minimal/reel-9-angles/frames/a05.png')"><span>5</span></div><div class="t" id="t5" style="left:697px;top:704px;background-image:url('file:///home/user/hibi-green-tea/docs/content-plan/campaigns/lifestyle-minimal/reel-9-angles/frames/a06.png')"><span>6</span></div><div class="t" id="t6" style="left:93px;top:1078px;background-image:url('file:///home/user/hibi-green-tea/docs/content-plan/campaigns/lifestyle-minimal/reel-9-angles/frames/a07.png')"><span>7</span></div><div class="t" id="t7" style="left:395px;top:1078px;background-image:url('file:///home/user/hibi-green-tea/docs/content-plan/campaigns/lifestyle-minimal/reel-9-angles/frames/a08.png')"><span>8</span></div><div class="t" id="t8" style="left:697px;top:1078px;background-image:url('file:///home/user/hibi-green-tea/docs/content-plan/campaigns/lifestyle-minimal/reel-9-angles/frames/a09.png')"><span>9</span></div><div id="more">…เล่าได้อีกเยอะ 👀</div><div id="veil"></div>
<div id="end"><div class="a">มุมไหน<br>คือคุณ?</div><div class="b">คอมเมนต์เลข 1–9 👇</div><div class="c">@hibimatchacafe</div></div></div>
<script>
const G0=11.0;
const back=x=>{const c=1.8;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, cl=x=>Math.max(0,Math.min(1,x));
function render(t){
 const H=document.getElementById('hook').children;
 [[0.1,0],[0.6,1]].forEach(([s,i])=>{const u=t-s,v=1.95-t;const o=u<0?0:cl(u/0.12)*cl(v/0.12);H[i].style.opacity=o;H[i].style.transform=`scale(${u<0?0.8:(u<0.3?back(u/0.3):1)})`});
 const C=document.getElementById('cnt');
 if(t>=2&&t<G0){const k=Math.floor(t-2);C.textContent=String(k+1).padStart(2,'0')+' / 09';const u=(t-2)%1;C.style.opacity=cl(u/0.08)*cl((1-u)/0.06)} else C.style.opacity=0;
 const Gd=document.getElementById('grid');Gd.style.opacity=t<G0?0:cl((t-G0)/0.12);
 for(let i=0;i<9;i++){const e=document.getElementById('t'+i),u=t-(G0+0.15+i*0.125);
  e.style.opacity=u<0?0:cl(u/0.08);e.style.transform=`scale(${u<0?0.6:(u<0.3?back(u/0.3):1)})`;e.children[0].style.opacity=cl((t-13.9)/0.3)}
 const M=document.getElementById('more'),um=t-12.5;M.style.opacity=um<0?0:cl(um/0.2)*cl((14.0-t)/0.2);M.style.transform=`translateY(${um<0?20:Math.max(0,20*(1-um/0.3))}px)`;
 const V=document.getElementById('veil'),ue=t-14.0;V.style.background=`rgba(246,244,238,${0.86*cl(ue/0.3)})`;
 const E=document.getElementById('end');E.style.opacity=cl(ue/0.25);E.style.transform=`scale(${ue<0?0.9:(ue<0.35?back(ue/0.35):1)})`;
}
</script></body></html>
