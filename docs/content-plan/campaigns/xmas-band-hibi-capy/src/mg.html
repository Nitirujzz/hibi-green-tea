<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:'Prompt';font-weight:600;src:url('file:///root/.fonts/Prompt-600-thai.woff2') format('woff2');}@font-face{font-family:'Prompt';font-weight:600;src:url('file:///root/.fonts/Prompt-600-latin.woff2') format('woff2');}@font-face{font-family:'Prompt';font-weight:700;src:url('file:///root/.fonts/Prompt-700-thai.woff2') format('woff2');}@font-face{font-family:'Prompt';font-weight:700;src:url('file:///root/.fonts/Prompt-700-latin.woff2') format('woff2');}
*{margin:0;padding:0;box-sizing:border-box} html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Prompt}
.st{position:absolute;left:540px;transform-origin:50% 50%;white-space:nowrap;text-align:center;font-weight:700;font-size:64px;line-height:1.2;color:#243e1b;
 background:#fffaf0;padding:22px 44px;border-radius:44px;border:6px solid #4e7c3a;box-shadow:0 14px 0 #2f5a24,0 22px 40px rgba(0,0,0,.25);opacity:0}
.r{color:#d0343c}
#snow{position:absolute;inset:0}
#end{position:absolute;left:90px;right:90px;top:250px;background:rgba(255,250,240,.97);border-radius:56px;border:7px solid #4e7c3a;box-shadow:0 16px 0 #2f5a24,0 26px 50px rgba(0,0,0,.25);
 padding:44px 30px 40px;text-align:center;opacity:0;transform-origin:50% 0}
#end .l{opacity:0;white-space:nowrap}
#end .a{font-weight:700;font-size:68px;color:#243e1b;line-height:1.15}
#end .b{font-weight:700;font-size:56px;color:#d0343c;margin-top:12px}
#end .c{font-weight:600;font-size:46px;color:#2f4a22;margin-top:26px;padding-top:24px;border-top:5px dashed #cfe0bd}

</style></head><body><canvas id="snow" width="1080" height="1920"></canvas>
<div class="st" id="s0" style="top:250px">🎄 Hibi &amp; Capy<br><span class="r">Holiday Jam!</span></div><div class="st" id="s1" style="top:270px">🎸 Capy on guitar</div><div class="st" id="s2" style="top:260px">Season of Giving 🎁</div><div class="st" id="s3" style="top:250px">เปิดกล่อง…เจอมัทฉะ! 💚</div><div class="st" id="s4" style="top:250px">ความสุข…<span class="r">ต้องส่งต่อ</span> 🎁</div><div class="st" id="s5" style="top:240px">ส่งความสดชื่น<br><span class="r">ให้คนที่คุณรัก</span> 💚</div><div class="st" id="s6" style="top:250px">เขียว · สด · ชื่นใจ ✨</div><div class="st" id="s7" style="top:250px">Merry <span class="r">Matcha</span>-mas! 🎄</div>
<div id="end"><div class="l a">Merry Matcha-mas 🎄</div><div class="l b">ส่งความสดชื่นเป็นของขวัญ</div><div class="l c">แท็กคนที่อยากส่งมัทฉะให้ 💚</div><div class="l d">@hibimatchacafe</div></div>
<script>
const ST=[[0.05, 1.95, -3], [2.05, 3.95, 2], [4.05, 7.9, -2], [8.05, 9.95, 2], [12.0, 13.95, -3], [14.05, 17.9, 2], [18.05, 21.9, -2], [22.05, 25.95, 2]], BEAT=0.5;
const ease=x=>1-Math.pow(1-x,3), back=x=>{const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function pop(t,a,b){ // scale/opacity for a sticker living [a,b]
 if(t<a||t>b) return [0,0]; const u=t-a, v=b-t;
 let s=u<0.28?back(Math.min(1,u/0.28)):1, o=Math.min(1,u/0.08);
 const ph=((t-a)%BEAT)/BEAT; s*=1+0.045*Math.exp(-ph*7);   // bounce on every beat
 if(v<0.15){s*=0.6+0.4*v/0.15;o*=v/0.15} return [s,o];}
let R=(i)=>{let x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
function snow(t){const c=document.getElementById('snow').getContext('2d');c.clearRect(0,0,1080,1920);
 for(let i=0;i<70;i++){const sp=60+R(i)*110, r=3+R(i+9)*7, x0=R(i+3)*1080, y=((R(i+5)*2100+sp*t)%2100)-90;
  const x=x0+Math.sin(t*1.3+i)*26; c.globalAlpha=0.35+0.4*R(i+7); c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill();}}
function render(t){snow(t);
 ST.forEach(([a,b,r],i)=>{const [s,o]=pop(t,a,b),e=document.getElementById('s'+i);
  e.style.opacity=o; e.style.transform=`translateX(-50%) rotate(${r+ (o?Math.sin(t*3)*1.2:0)}deg) scale(${s})`;});
 const E=document.getElementById('end'), u=t-26.0;
 if(u<0){E.style.opacity=0} else {E.style.opacity=Math.min(1,u/0.1); E.style.transform=`scale(${u<0.3?back(u/0.3):1})`;
  [...E.children].forEach((l,k)=>{const w=u-0.2-k*0.25; l.style.opacity=w<0?0:Math.min(1,w/0.1);
   l.style.transform=`scale(${w<0?0.6:(w<0.25?back(w/0.25):1+0.03*Math.exp(-(((u)%BEAT)/BEAT)*7))})`;});}
}
</script></body></html>
